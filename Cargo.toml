[workspace]
resolver = "2"
members = [
    "spikes",
    "crates/clipd-ipc",
    "crates/clipd-core",
    "crates/clipd-platform",
    "crates/clipd",
    "crates/clipctl",
    "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
clipd-ipc = { path = "crates/clipd-ipc" }
clipd-core = { path = "crates/clipd-core" }
clipd-platform = { path = "crates/clipd-platform" }

x11rb = { version = "0.13", features = ["xfixes", "xtest", "xinput"] }
rusqlite = { version = "0.40", features = ["bundled"] }
blake3 = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
ts-rs = "12.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
