[workspace]
resolver = "2"
members = [
    "spikes",
    "crates/clipd-ipc",
    "crates/clipd-core",
    "crates/clipd-platform",
    "crates/clipd",
    "crates/clipctl",
    "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
clipd-ipc = { path = "crates/clipd-ipc" }
clipd-core = { path = "crates/clipd-core" }
clipd-platform = { path = "crates/clipd-platform" }

x11rb = { version = "0.13", features = ["xfixes", "xtest", "xinput"] }
rusqlite = { version = "0.40", features = ["bundled"] }
blake3 = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
ts-rs = "12.0"

# Wayland auto-paste (RemoteDesktop portal). Pure D-Bus, no system libdbus
# headers needed. Confined to crates/clipd-platform/src/portal.rs and its own
# background thread — the rest of the daemon stays synchronous/thread-based.
# remote_desktop's own source references the screencast module (combined
# remote-desktop+screen-share sessions are the same portal), so it must be
# enabled too even though we only ever select DeviceType::Keyboard.
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
tokio = { version = "1", features = ["rt", "time"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
