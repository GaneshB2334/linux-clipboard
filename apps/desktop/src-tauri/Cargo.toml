[package]
name = "clipd-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "clipd_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Without `custom-protocol` the binary loads `devUrl` (http://localhost:1420)
# instead of the bundled frontend, so a plain `cargo build --release` produces a
# window showing "Connection refused". `tauri build` passes this automatically;
# making it the default keeps a bare cargo build working too.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
clipd-ipc.workspace = true
clipd-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
# Only used to match on RawWindowHandle::Wayland/RawDisplayHandle::Wayland and
# extract plain pointer values for clipd_platform::portal::WindowRef — see the
# Portal setup in lib.rs for why a real window handle matters here.
raw-window-handle = "0.6"
# Version pinned to match what Tauri's own Linux backend already resolves to
# (see Cargo.lock) so `gtk_window()`'s return type and our direct gtk calls
# agree on the same crate instance. Needed only to force-realize the popup's
# GTK widget before it has ever been shown — see `window_ref` in lib.rs.
gtk = "0.18"
